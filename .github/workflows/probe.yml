name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build -x test
      - name: Probe
        run: |
          C=$(find ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft -name 'minecraft-clientonly-1.21.11*.jar' | grep -v intermediary | head -1)
          M=$(find ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft -name 'minecraft-common-1.21.11*.jar' | grep -v intermediary | head -1)
          A=$(find ~/.gradle -name 'authlib*.jar' | grep -v sources | head -1)
          CP="$C:$M:$A"
          echo "== Minecraft"; javap -p -cp "$CP" net.minecraft.client.Minecraft | grep -iE "session|services|getUser"
          echo "== User"; javap -p -cp "$CP" net.minecraft.client.User | grep -iE "token|profileId|getName"
          echo "== Entity.getDisplayName"; javap -p -cp "$CP" net.minecraft.world.entity.Entity | grep -iE "getDisplayName|getName\("
          echo "== Player getDisplayName"; javap -p -cp "$CP" net.minecraft.world.entity.player.Player | grep -iE "getDisplayName"
          echo "== Style font"; javap -p -cp "$CP" net.minecraft.network.chat.Style | grep -iE "withFont|FontDescription"
          echo "== Services"; javap -p -cp "$CP" net.minecraft.server.Services | head -20
          echo "== SessionService"; javap -p -cp "$CP" com.mojang.authlib.minecraft.MinecraftSessionService | head -20
          echo "== ClientLevel players"; javap -p -cp "$CP" net.minecraft.client.multiplayer.ClientLevel | grep -iE "players\(\)"
