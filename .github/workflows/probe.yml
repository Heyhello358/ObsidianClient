name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build -x test
      - name: Probe
        run: |
          C=$(find ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft -name 'minecraft-clientonly-1.21.11*.jar' | grep -v intermediary | head -1)
          M=$(find ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft -name 'minecraft-common-1.21.11*.jar' | grep -v intermediary | head -1)
          CP="$C:$M"
          echo "== cape classes"; for J in $C $M; do unzip -l $J | awk '{print $4}' | grep -iE "cape|PlayerSkin|ClientAsset|AvatarRenderState" ; done
          for c in net.minecraft.world.entity.player.PlayerSkin 'net.minecraft.world.entity.player.PlayerSkin$Patch' net.minecraft.core.ClientAsset 'net.minecraft.core.ClientAsset$ResourceTexture' 'net.minecraft.core.ClientAsset$Texture' net.minecraft.client.renderer.entity.state.AvatarRenderState; do echo "== $c"; javap -p -cp "$CP" "$c" 2>&1 | grep -vE "^Compiled" | head -40; done
          echo "== AbstractClientPlayer skin"; javap -p -cp "$CP" net.minecraft.client.player.AbstractClientPlayer | grep -iE "skin|cape"
