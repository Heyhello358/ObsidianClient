name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build -x test
      - name: Probe
        run: |
          C=$(find ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft -name 'minecraft-clientonly-1.21.11*.jar' | grep -v intermediary | head -1)
          M=$(find ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft -name 'minecraft-common-1.21.11*.jar' | grep -v intermediary | head -1)
          CP="$C:$M"
          for c in net.minecraft.world.entity.player.ProfilePublicKey 'net.minecraft.world.entity.player.ProfilePublicKey$Data'; do echo "== $c"; javap -p -cp "$CP" "$c" 2>&1 | grep -vE "^Compiled|lambda|method_" | head -30; done
          echo "== publickeys structure"; curl -sS --max-time 20 https://api.minecraftservices.com/publickeys | python3 -c "import sys,json; d=json.load(sys.stdin); print({k:len(v) for k,v in d.items()})"
