name: Build Obsidian Client
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build -Pversion=0.2.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ObsidianClient-jar
          path: build/libs/*.jar
      - name: Pick the main jar
        run: mkdir dist && cp "$(ls build/libs/*.jar | grep -v sources | head -1)" dist/
      - name: Publish release (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Obsidian Client 0.2.${{ github.run_number }}
          body: Automatic build. Needs Minecraft 1.21.11 + Fabric Loader + Fabric API.
          files: dist/*.jar
