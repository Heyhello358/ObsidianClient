name: Build Obsidian Client
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build -Pversion=0.2.${{ github.run_number }}
      - name: Probe Minecraft classes (temporary)
        continue-on-error: true
        run: |
          for J in $(find ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft -name 'minecraft-clientonly-1.21.11*.jar' -o -name 'minecraft-common-1.21.11*.jar' | grep -v intermediary); do
            echo "JAR=$J"
            unzip -l "$J" | awk '{print $4}' | grep -iE "hitbox|debug/DebugScreenEntr|DebugScreenEntryStatus|DebugScreenEntryList" | head -20
          done
          J=$(find ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft -name 'minecraft-clientonly-1.21.11*.jar' | grep -v intermediary | head -1)
          for c in net.minecraft.client.gui.components.debug.DebugScreenEntries net.minecraft.client.gui.components.debug.DebugScreenEntryList; do echo "== $c"; javap -p -cp "$J" $c 2>&1 | grep -iE "hitbox|public|status" | head -25; done
          echo "== Minecraft debug fields"; javap -p -cp "$J" net.minecraft.client.Minecraft 2>&1 | grep -iE "debug" | head -15
      - uses: actions/upload-artifact@v4
        with:
          name: ObsidianClient-jar
          path: build/libs/*.jar
      - name: Publish release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release create "v0.2.${{ github.run_number }}" "$JAR" \
            --title "Obsidian Client 0.2.${{ github.run_number }}" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. Needs Minecraft 1.21.11 + Fabric Loader + Fabric API."
