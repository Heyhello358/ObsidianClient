name: Build Obsidian Client
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build -Pversion=0.2.${{ github.run_number }}
      - name: Probe Minecraft classes (temporary)
        continue-on-error: true
        run: |
          find ~/.gradle/caches -name '*.jar' | grep -iE 'minecraft' | head -20
          J=$(find ~/.gradle/caches -name '*.jar' | grep -iE 'minecraft.*(merged|client|mapped)' | grep -v sources | head -1)
          echo "JAR=$J"
          unzip -l "$J" | grep -iE "ParticleStatus|DebugScreenEntr|EntityRenderDispatcher|DebugRenderer|HitboxRenderer" | awk '{print $4}' | head -30
          for c in net.minecraft.client.renderer.entity.EntityRenderDispatcher net.minecraft.client.gui.components.debug.DebugScreenEntries; do echo "== $c"; javap -p -cp "$J" $c 2>&1 | grep -iE "hitbox|Hitbox|static .*Identifier" | head -20; done
      - uses: actions/upload-artifact@v4
        with:
          name: ObsidianClient-jar
          path: build/libs/*.jar
      - name: Publish release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release create "v0.2.${{ github.run_number }}" "$JAR" \
            --title "Obsidian Client 0.2.${{ github.run_number }}" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. Needs Minecraft 1.21.11 + Fabric Loader + Fabric API."
