name: Deploy backend
on:
  push:
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set - backend not deployed (see README)."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Create database (first time only) and deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: backend
        run: |
          npx --yes wrangler@4 d1 create obsidian-backend || echo "database already exists"
          ID=$(npx --yes wrangler@4 d1 list --json | python3 -c "import sys,json; print(next(d['uuid'] for d in json.load(sys.stdin) if d['name']=='obsidian-backend'))")
          echo "database_id = \"$ID\"" >> wrangler.toml
          npx --yes wrangler@4 deploy
      - name: Diagnostics - how does Mojang answer the server? (temporary)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 8
          echo "== from the Cloudflare Worker"; curl -sS --max-time 40 https://obsidian-backend.obsidianclient.workers.dev/debug/mojang; echo
          echo "== from a GitHub runner, for comparison"
          curl -sS -o /dev/null -w "hasJoined direct: %{http_code}\n" "https://sessionserver.mojang.com/session/minecraft/hasJoined?username=Notch&serverId=00000000000000000000000000000000"
